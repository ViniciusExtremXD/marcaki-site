    <!-- Consent Mode v2 (LGPD): tudo negado até o visitante aceitar no aviso de cookies -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("consent", "default", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: "denied",
        personalization_storage: "denied",
        functionality_storage: "granted",
        security_storage: "granted",
        wait_for_update: 500,
      });
      gtag("set", "url_passthrough", true);
      gtag("set", "ads_data_redaction", true);
      try {
        if (localStorage.getItem("marcaki-consent") === "granted") {
          gtag("consent", "update", { ad_storage: "granted", ad_user_data: "granted", ad_personalization: "granted", analytics_storage: "granted", personalization_storage: "granted" });
        }
      } catch (e) {}
    </script>

    <!--
      Google Tag Manager — só carrega no domínio de produção (marcaki.app), para que prévias
      (GitHub Pages, localhost) não mandem visitas para o GA4. Para testar numa prévia: ?gtm_debug=x ou ?track=1.
      O ID vem de VITE_GTM_ID (.env). Enquanto for GTM-XXXXXXX, nada carrega. A medição entra só depois
      de o site ser aprovado (ver TRACKING.md).
    -->
    <script>
      (function (w, d, s, l, i) {
        var prod = /(^|\.)marcaki\.app$/.test(w.location.hostname);
        var debug = /[?&](gtm_debug|track)=/.test(w.location.search);
        w[l] = w[l] || [];
        if ((!prod && !debug) || !/^GTM-[A-Z0-9]+$/.test(i) || /^GTM-X+$/.test(i)) return;
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0], j = d.createElement(s);
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "%VITE_GTM_ID%");
    </script>
